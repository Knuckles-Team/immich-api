INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml
site_name: "immich-api"
site_description: "Immich Api API + MCP Server"
site_url: "https://knuckles-team.github.io/immich-api/"
repo_name: "Knuckles-Team/immich-api"
repo_url: "https://github.com/Knuckles-Team/immich-api"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

plugins:
  - search

extra:
  ecosystem:
    current: "immich-api"

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Installation: installation.md
  - Deployment: deployment.md
  - Usage (API / CLI / MCP): usage.md
  - Immich capabilities and evidence: immich-capabilities.md
  - Backing Platform (Immich Api): platform.md
  - Concepts: concepts.md
  - Glossary: glossary.md
  - Spec delivery: spec-delivery.md
